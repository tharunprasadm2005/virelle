<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virelle — Recipes that learn your taste</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="logo" href="index.html"><img src="assets/virelle-mark.svg" alt="Virelle" width="30" height="30" style="vertical-align:-6px;margin-right:6px">Virelle<small>Recipes that learn your taste</small></a>
<nav class="mainnav"></nav><div class="userbox"><a href="auth.html">Log in</a><a href="auth.html">Sign up</a></div></header>

<p><strong>Recipes that learn your taste.</strong></p>

<script>
nav("index.html");
if(token())location.href="home.html";
document.getElementById("sections").innerHTML=[
