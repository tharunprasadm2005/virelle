<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virelle — What can I cook?</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="logo" href="home.html"><img src="assets/virelle-mark.svg" alt="Virelle" width="30" height="30" style="vertical-align:-6px;margin-right:6px">Virelle<small>Recipes that learn your taste</small></a>
<nav class="mainnav"></nav><div class="userbox"><a href="profile.html">Profile</a><a href="#" onclick="logout();return false">Logout</a></div></header>
<main><h1>What can I cook?</h1>
<p class="muted">Ranked by what's in <a href="pantry.html">your pantry</a>, your taste, and recipe quality.</p>
<div class="row"><select id="diet" style="max-width:190px"><option value="">Any diet</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option></select>
<button onclick="load()">Find recipes</button></div>
<div id="out" class="grid" style="margin-top:.8rem"></div></main>
<nav class="bottomnav"></nav>
<script src="js/app.js"></script>
<script>
nav("pantry.html");
async function load(){
  const d=document.getElementById("diet").value;
  setLoading("out","Searching 500K recipes against your pantry — a few seconds…");
  try{
    const r=await api("/api/cook/matches?min_coverage=0.3&limit=24"+(d?("&diet="+encodeURIComponent(d)):""));
    if(r.pantry_empty){document.getElementById("out").innerHTML="<p class='muted'>"+esc(r.message)+"</p>";return;}
    if(!r.matches.length){
      let h="<p class='muted'>"+esc(r.message||"No matches — add more pantry staples.")+"</p>";
      if(r.understood_as){h+="<p class='small muted'>We looked for: "+r.understood_as.map(esc).join(", ")+"</p>";}
      document.getElementById("out").innerHTML=h;return;
    }
    document.getElementById("out").innerHTML=r.matches.map(cardCook).join("");
  }catch(e){document.getElementById("out").innerHTML="<p>Something went wrong: "+esc(e.message)+' <a href="#" onclick="load();return false">Retry</a></p>';}
}
function cardCook(c){
  return '<div class="rcard">'+imgHtml(c)+'<div class="body">'
    +'<a class="title" href="recipe.html?id='+c.recipe_id+'" style="color:inherit;text-decoration:none">'+esc(c.name)+'</a>'
    +metaLine(c)
    +'<div class="small"><strong>'+Math.round(c.coverage*100)+'% ingredient coverage</strong> · match '+c.cook_score+'</div>'
    +'<div class="actions"><button class="icon" onclick="miss('+c.recipe_id+')">Missing?</button>'
    +'<button class="icon" onclick="act('+c.recipe_id+',\'SAVE\')">Save</button></div>'
    +'<div id="m'+c.recipe_id+'" class="small muted"></div></div></div>';
}
async function miss(rid){const m=await api(`/api/cook/missing/${rid}`);
document.getElementById("m"+rid).innerHTML=m.missing.length?`Missing: ${m.missing.map(esc).join(", ")} <a href="#" onclick="toShop(${rid});return false">add all to shopping list</a>`:"You have everything! 🎉";}
async function toShop(rid){const r=await api(`/api/cook/missing-to-shopping/${rid}`,{method:"POST"});toast(`Added ${r.added} items to your shopping list.`);}
(async()=>{await requireUser();load();})();
</script></body></html>
