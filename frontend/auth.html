<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virelle — Recipes that learn your taste</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body><main style="max-width:460px"><div class="card" style="margin-top:3rem;text-align:center">
<h1 style="color:var(--accent)">Virelle</h1><p class="muted">Recipes that learn your taste.</p>
<div class="row" style="justify-content:center"><button id="t-login" class="ghost">Log in</button><button id="t-reg">Sign up</button></div>
<div id="f-login">
<label class="f">Email</label><input id="l-email" type="email" autocomplete="email">
<label class="f">Password</label><input id="l-pass" type="password" autocomplete="current-password">
<p><button onclick="doLogin()" style="width:100%">Log in</button></p>
<p class="small muted">Just looking? <a href="#" onclick="demo();return false">Try the demo account</a></p>
</div>
<div id="f-reg" style="display:none">
<label class="f">Your name</label><input id="r-name" placeholder="e.g. Tharun">
<label class="f">Email</label><input id="r-email" type="email">
<label class="f">Password (min 6 characters)</label><input id="r-pass" type="password" autocomplete="new-password">
<p><button onclick="doReg()" style="width:100%">Create account →</button></p>
</div>
<p id="err" class="small" style="color:#a33"></p>
</div></main>
<script src="js/app.js"></script>
<script>
if(token())location.href="home.html";
const tl=document.getElementById("t-login"),tr=document.getElementById("t-reg");
tl.onclick=()=>{document.getElementById("f-login").style.display="";document.getElementById("f-reg").style.display="none";};
tr.onclick=()=>{document.getElementById("f-login").style.display="none";document.getElementById("f-reg").style.display="";};
async function doLogin(){try{const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:document.getElementById("l-email").value,password:document.getElementById("l-pass").value})});setToken(r.token);location.href=r.user.has_preferences?"home.html":"onboarding.html";}catch(e){document.getElementById("err").textContent=e.message;}}
async function doReg(){const name=document.getElementById("r-name").value;try{const r=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name,email:document.getElementById("r-email").value,password:document.getElementById("r-pass").value})});setToken(r.token);location.href="onboarding.html";}catch(e){document.getElementById("err").textContent=e.message;}}
async function demo(){const EM="demo@virelle.app";try{const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:EM,password:"tasteflow-demo"})});setToken(r.token);location.href="home.html";}catch(e){try{const r2=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:"Tharun Demo",email:EM,password:"tasteflow-demo",demo:true})});setToken(r2.token);location.href="home.html";}catch(e2){document.getElementById("err").textContent=e2.message;}}}
</script></body></html>
