<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virelle — Discover</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><a class="logo" href="home.html"><img src="assets/virelle-mark.svg" alt="Virelle" width="30" height="30" style="vertical-align:-6px;margin-right:6px">Virelle<small>Recipes that learn your taste</small></a>
<nav class="mainnav"></nav><div class="userbox"><a href="profile.html">Profile</a><a href="#" onclick="logout();return false">Logout</a></div></header>
<main>
<h1>Discover</h1>
<div class="searchbar"><input id="q" placeholder="quick chicken dinner, healthy paneer, dessert..."><button onclick="search()">Search</button></div>
<div class="row" style="margin-top:.6rem">
<select id="f-time" style="max-width:190px"><option value="">Any time</option><option value="15">Under 15 min</option><option value="30">Under 30 min</option><option value="60">Under 60 min</option></select>
<select id="f-diet" style="max-width:190px"><option value="">Any diet</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option></select>
</div>
<div id="results"></div>
<div class="card"><h2>Import a recipe from a URL</h2>
<div class="row"><input id="imp" placeholder="https://..." style="flex:1"><button onclick="imp()">Import</button></div>
<p id="imsg" class="small muted"></p></div>
<div id="sections"></div>
</main>
<nav class="bottomnav"></nav>
<script src="js/app.js"></script>
<script>
nav("discover.html");
async function search(){
  const q=document.getElementById("q").value.trim();if(!q)return;
  setLoading("results","Searching…");
  try{
    const t=document.getElementById("f-time").value,d=document.getElementById("f-diet").value;
    let url="/api/recipes/search?q="+encodeURIComponent(q);
    if(t)url+="&max_minutes="+t;
    if(d)url+="&diet="+d;
    const r=await api(url);document.getElementById("sections").innerHTML="";
    const cards=r.results.map(c=>recipeCard(c)).join("")||"<p class='muted'>No matches — try fewer words.</p>";
    document.getElementById("results").innerHTML="<h2>Results ("+r.results.length+")</h2>"+'<div class="grid">'+cards+"</div>";
  }catch(e){document.getElementById("results").innerHTML="<p>Search failed: "+esc(e.message)+' <a href="#" onclick="search();return false">Retry</a></p>';}
}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search();});
async function imp(){const u=document.getElementById("imp").value.trim();if(!u)return;
document.getElementById("imsg").textContent="Importing…";
try{const r=await api("/api/imports",{method:"POST",body:JSON.stringify({url:u})});
document.getElementById("imsg").textContent=`Imported “${r.title}” from ${r.source_name}. Find it under Profile → My imports.`;}catch(e){document.getElementById("imsg").textContent=e.message;}}
(async()=>{await requireUser();
const qs=new URLSearchParams(location.search).get("q");if(qs){document.getElementById("q").value=qs;search();}
const d=await api("/api/discover");
document.getElementById("sections").innerHTML=d.sections.filter(Boolean).map(s=>`<h2>${esc(s.label)}</h2><div class="grid">${s.recipes.map(c=>recipeCard(c)).join("")}</div>`).join("");})();
</script></body></html>
